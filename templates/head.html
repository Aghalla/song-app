<div class="larg-header">

    <div class="upload-music">
        {% if user.is_authenticated %}
            <a href="{% url 'Music:add_music' %}" class="btn-upload-nav">آپلود موزیک جدید</a>
        {% endif %}
    </div>

    <div class="title-site">
        <h1><a href="{% url 'Music:index' %}">SuniQ</a></h1>
    </div>

    <div class="left-nav-group">
        <div class="search-box">
            <form method="get" action="{% url 'Music:search' %}" class="search-form">
                <input type="text" name="query" placeholder="جستجو..." required>
                <button type="submit" class="search-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>
        </div>

        <div class="home-icon">
            <a href="{% url 'Music:index' %}" title="خانه">
                <svg width="26px" height="26px" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0L0 6V8H1V15H4V10H7V15H15V8H16V6L14 4.5V1H11V2.25L8 0ZM9 10H12V13H9V10Z"></path>
                </svg>
            </a>
        </div>

        <div class="loginORhome">
            {% if user.is_authenticated %}
                <a href="{% url 'profile:profile_index' %}" title="پروفایل" class="profile-avatar-link">
                    <svg width="28px" height="28px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 12C14.2091 12 16 10.2091 16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 20C6 17 9 15 12 15C15 15 18 17 18 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            {% else %}
                <div class="auth-links">
                    <a href="{% url 'profile:login_user' %}">ورود</a>
                    <span>/</span>
                    <a href="{% url 'profile:signup' %}">ثبت‌نام</a>
                </div>
            {% endif %}
        </div>
    </div>

</div>
