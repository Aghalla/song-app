{% load static %}

<link rel="stylesheet" type="text/css" href="{% static 'Account/rigester/login.css' %}">

<div class="larg">
    <!-- انیمیشن ایموجی میمون در بالای فرم -->
    <div class="emoji-avatar-container">
        <span id="monkeyEmoji" class="monkey-emoji">🙈</span>
    </div>

    <form method="post" id="loginForm">
        {% csrf_token %}
        <div class="form">
            {{ login_form.as_p }}
        </div>

        <div class="button">
            <input type="submit" value="ورود">
        </div>

        <div class="moving-to">
            <a href="{% url 'profile:register' %}">فراموشی رمز عبور</a>
            <a href="{% url 'profile:signup' %}">ساخت حساب</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // پیدا کردن فیلد پسورد جنگو به صورت خودکار از روی نوع اینپوت
        const passwordInput = document.querySelector('input[type="password"]');
        const monkeyEmoji = document.getElementById("monkeyEmoji");

        if (passwordInput) {
            // ایجاد کانتینر نگهدارنده برای آیکون چشم
            const wrapper = document.createElement("div");
            wrapper.className = "password-field-wrapper";

            // قرار دادن کانتینر به جای اینپوت اصلی
            passwordInput.parentNode.insertBefore(wrapper, passwordInput);
            wrapper.appendChild(passwordInput);

            // ساخت دکمه چشمک
            const toggleBtn = document.createElement("button");
            toggleBtn.type = "button";
            toggleBtn.className = "toggle-password-visibility";
            // آیکون چشم بسته پیش‌فرض
            toggleBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-closed">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            `;
            wrapper.appendChild(toggleBtn);

            // رویداد کلیک روی دکمه چشم
            toggleBtn.addEventListener("click", function () {
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    monkeyEmoji.textContent = "🐵"; // میمون چشمش را باز می‌کند
                    monkeyEmoji.classList.add("peeking");

                    // تغییر آیکون به چشم باز
                    toggleBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-open">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    `;
                } else {
                    passwordInput.type = "password";
                    monkeyEmoji.textContent = "🙈"; // میمون چشمش را می‌بندد
                    monkeyEmoji.classList.remove("peeking");

                    // تغییر آیکون به چشم بسته
                    toggleBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-closed">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    `;
                }
            });
        }
    });
</script>
