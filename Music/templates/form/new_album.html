{% extends 'base.html' %}
{% load static %}

{% block title %}ساخت آلبوم جدید{% endblock %}

{% block style %}
    <link rel="stylesheet" type="text/css" href="{% static 'form/new_albums.css' %}">
{% endblock %}

{% block content %}
<div class="form-page-wrapper">
    <div class="glass-form-card">

        <div class="form-header-area">
            <div class="form-icon-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1db954" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 5v3m0 8v3M5 12h3m8 0h3"></path>
                </svg>
            </div>
            <h2>ساخت آلبوم جدید</h2>
            <p class="form-subtitle">مشخصات البوم خود را وارد کنید</p>
        </div>


        <form method="post" enctype="multipart/form-data" class="suniq-custom-form">
            {% csrf_token %}

            <div class="form-fields-container">
                {{ albums_form.as_p }}
            </div>

            <div class="form-actions-area">
                <button type="submit" class="suniq-submit-btn">
                    <span>ایجاد آلبوم</span>
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
